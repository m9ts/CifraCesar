spring.application.name=CifraCesaar

# O Render injeta a porta em PORT; localmente cai no 8080.
server.port=${PORT:8080}

# Titulo da aba do navegador na pagina do Swagger UI.
# O titulo grande da pagina vem de info.title no bean OpenAPI (config/OpenApiConfig.java).
# O \u00e9 é necessário porque application.properties é lido em ISO-8859-1.
springdoc.swagger-ui.document-title=API de Cifra de C\u00e9sar

# Gera o documento no mesmo formato da spec de referencia (OpenAPI 3.0.0).
springdoc.api-docs.version=openapi_3_0
